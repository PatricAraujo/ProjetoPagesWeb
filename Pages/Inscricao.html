<!DOCTYPE html>
<html lang="pt" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSS Bootstrap 5.3.3 (Estável para manter os cartões e grelha funcionais) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Icons Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- CSS pagina -->
    <link rel="stylesheet" href="../CSS/style.css">

    <title> CESAE Digital – Desenvolvimento das Competências Digitais </title>
    <link rel="icon" href="../Image/favicon.ico" sizes="any">
</head>

<body>

    <!-- header-start -->
    <header>
        <!-- Top NAV -->
        <nav class="navbar navbar-expand-lg sticky-top">
            <div class="container-fluid justify-content-between">
                <a class="navbar-brand" href="../index.html">
                    <img src="../Image/cesae-short.svg" alt="logo-CESAE">
                </a>
                <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer"
                    data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir menu">
                    <i class="bi bi-list"></i>
                </button>
                <dialog class="drawer drawer-end flex-grow-1" tabindex="-1" id="navbarNav"
                    aria-labelledby="navbarNavLabel">
                    <div class="drawer-header">
                        <h5 class="drawer-title" id="navbarNavLabel">Menu</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Fechar"></button>
                    </div>
                    <div class="drawer-body w-100 d-flex flex-column flex-lg-row align-items-lg-center">

                        <ul class="navbar-nav mx-lg-auto mb-2 mb-lg-0">
                            <li class="nav-item">
                                <a class="nav-link" href="../index.html">Inicio</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="CursosModulos.html">Cursos</a>
                            </li>
                            <li class="nav-item active">
                                <a class="nav-link" aria-current="page" href="Parceiros.html">Parceiros</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="Contactos.html">Contactos</a>
                            </li>
                        </ul>
                        <!-- Formulário limpo, sem style inline -->
                        <form
                            class="position-relative d-flex align-items-center mt-3 mt-lg-0 w-100 w-lg-auto search-form-custom"
                            role="search" action="CursosModulos.html" method="get">
                            <input class="form-control rounded-pill text-truncate pe-5 w-100 search-input-custom"
                                type="search" name="q" placeholder="Encontra o Curso que procuras"
                                aria-label="Pesquisar cursos">
                            <button class="btn-search" type="submit" aria-label="Pesquisar">
                                <i class="bi bi-search" aria-hidden="true"></i>
                            </button>
                        </form>
                    </div>
                </dialog>
            </div>
        </nav>
    </header>

    <!-- main start -->
    <main class="container my-5">

        <!-- Secção de Inscrição / Formulário -->
        <section id="inscricao" class="py-5">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-md-8 col-lg-6">
                        <div class="card shadow-sm border-0">
                            <div class="card-body p-4 p-md-5">
                                <h2 class="card-title text-center mb-4 fw-bold">Inscrição no Curso</h2>
                                <p class="text-muted text-center mb-4">
                                    Preencha os seus dados abaixo para efetuar a sua candidatura.
                                </p>

                                <form class="needs-validation">
                                    <!-- Nome Completo -->
                                    <div class="mb-3">
                                        <label for="nome" class="form-label fw-semibold">Nome Completo</label>
                                        <input type="text" class="form-control" id="nome" name="nome"
                                            placeholder="Digite o seu nome completo" required>
                                    </div>

                                    <!-- Email -->
                                    <div class="mb-3">
                                        <label for="email" class="form-label fw-semibold">Endereço de E-mail</label>
                                        <input type="email" class="form-control" id="email" name="email"
                                            placeholder="exemplo@email.com" required>
                                    </div>

                                    <!-- Telefone -->
                                    <div class="mb-3">
                                        <label for="telefone" class="form-label fw-semibold">Telefone /
                                            Telemóvel</label>
                                        <input type="tel" class="form-control" id="telefone" name="telefone"
                                            placeholder="ex: 912 345 678" required>
                                    </div>

                                    <!-- Documento de Identificação -->
                                    <div class="mb-4">
                                        <label for="documento" class="form-label fw-semibold">Documento de Identificação
                                            (CC / Passaporte)</label>
                                        <input type="text" class="form-control" id="documento" name="documento"
                                            placeholder="N.º do Cartão de Cidadão ou Passaporte" required>
                                    </div>

                                    <!-- Botão de Inscrição -->
                                    <div class="d-grid">
                                        <a href="./CursosModulos.html"
                                            class="btn btn-institutional btn-lg fw-bold text-decoration-none text-center">
                                            Inscrever
                                        </a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- footer start -->
    <footer class="row py-2 m-0 border-top justify-content-between align-items-center footer-custom">
        <!-- copy right -->
        <div class="col-12 col-md-4 text-start small">
            <p class="mb-0">Copyright©2025 CESAE. Todos os direitos reservados</p>
        </div>

        <!-- logo -->
        <div class="col-12 col-md-4 text-center my-2 my-md-0">
            <img src="../Image/cesae-long-white.svg" alt="CESAE Digital Logo" class="footer-logo">
        </div>

        <!-- social media -->
        <div class="col-12 col-md-4 d-flex justify-content-end social-media-container">
            <ul class="social-media list-unstyled d-flex gap-4 p-0 mb-0">
                <li><a href="https://www.instagram.com/cesae.digital/" target="_blank" title="Instagram"><i
                            class="bi bi-instagram"></i></a></li>
                <li><a href="https://www.facebook.com/CesaeDigital" target="_blank" title="Facebook"><i
                            class="bi bi-facebook"></i></a></li>
                <li><a href="https://www.youtube.com/@cesaedigital" target="_blank" title="Youtube"><i
                            class="bi bi-youtube"></i></a></li>
                <li><a href="https://pt.linkedin.com/school/cesae-digital/" target="_blank" title="Linkedin"><i
                            class="bi bi-linkedin"></i></a></li>
            </ul>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>


</body>

</html>
