<!DOCTYPE html>
<html lang="pt" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSS Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Icons Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- CSS pagina -->
    <link rel="stylesheet" href="../CSS/style.css">

    <title> CESAE Digital – Desenvolvimento das Competências Digitais </title>
    <link rel="icon" href="../Image/favicon.ico" sizes="any">
</head>

<body>

    <!-- header-start -->
    <header>
        <!-- Top NAV -->
        <!-- navbar pra ficar aberto em ecra grande e fixado no topo -->
        <nav class="navbar navbar-expand-lg fixed-top bg-white shadow-sm">
            <div class="container">
                <!-- Logo -->
                <a class="navbar-brand me-0" href="../index.html">
                    <img src="../Image/cesae-digital-logo.svg" alt="CESAE Digital" height="40">
                </a>

                <!-- Botão para menu mobile usando o ID para trocar-->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Links alinhados à direita -->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                        <li class="nav-item">
                            <a class="nav-link text-dark fw-medium" href="../index.html">Início</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-dark fw-medium" href="../Pages/Parceiros.html">Parceiros</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-dark fw-medium" href="../Pages/Contactos.html">Contactos</a>
                        </li>
                        <li class="nav-item ms-lg-2">
                            <a class="btn btn-primary rounded-pill px-4" href="../Pages/CursosModulos.html">Cursos</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- main start -->
    <main class="container my-5">

        <!-- Secção de Inscrição / Formulário -->
        <section id="inscricao" class="py-5">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-md-8 col-lg-6">
                        <div class="card shadow-sm border-0">
                            <div class="card-body p-4 p-md-5">
                                <h2 class="card-title text-center mb-4 fw-bold">Inscrição no Curso</h2>
                                <p class="text-muted text-center mb-4">
                                    Preencha os seus dados abaixo para efetuar a sua candidatura.
                                </p>

                                <form action="#" method="POST" class="needs-validation">
                                    <!-- Nome Completo -->
                                    <div class="mb-3">
                                        <label for="nome" class="form-label fw-semibold">Nome Completo</label>
                                        <input type="text" class="form-control" id="nome" name="nome"
                                            placeholder="Digite o seu nome completo" required>
                                    </div>

                                    <!-- Email -->
                                    <div class="mb-3">
                                        <label for="email" class="form-label fw-semibold">Endereço de E-mail</label>
                                        <input type="email" class="form-control" id="email" name="email"
                                            placeholder="exemplo@email.com" required>
                                    </div>

                                    <!-- Telefone -->
                                    <div class="mb-3">
                                        <label for="telefone" class="form-label fw-semibold">Telefone /
                                            Telemóvel</label>
                                        <input type="tel" class="form-control" id="telefone" name="telefone"
                                            placeholder="ex: 912 345 678" required>
                                    </div>

                                    <!-- Documento de Identificação -->
                                    <div class="mb-4">
                                        <label for="documento" class="form-label fw-semibold">Documento de Identificação
                                            (CC / Passaporte)</label>
                                        <input type="text" class="form-control" id="documento" name="documento"
                                            placeholder="N.º do Cartão de Cidadão ou Passaporte" required>
                                    </div>

                                    <!-- Botão de Inscrição -->
                                    <div class="d-grid">
                                        <button href="../index.html" type="submit" class="btn btn-primary btn-lg fw-bold">
                                            Inscrever
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- footer start -->
    <footer>

    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
